<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Village Server</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15201a;
    --panel: #1f2c24;
    --panel-2: #283a2f;
    --line: #36503f;
    --text: #eef5ef;
    --muted: #9db3a3;
    --green: #6fdc6a;
    --red: #ff5a52;
    --gold: #ffcc33;
    --blue: #59b7ff;
    --brown: #c99a5b;
    --pixel: 'Press Start 2P', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 18px; }
  .logo { width: 48px; height: 48px; image-rendering: pixelated; border-radius: 6px; }
  h1 { font: 20px/1.3 var(--pixel); margin: 0; color: var(--gold); text-shadow: 3px 3px 0 #000; }
  h2 { font: 13px/1.4 var(--pixel); margin: 0 0 12px; color: var(--gold); }
  .pill { font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--panel-2); }
  .pill.on { color: var(--green); }
  .pill.off { color: var(--red); }
  .join { margin-left: auto; font-size: 14px; color: var(--muted); }
  .join code { color: var(--text); background: var(--panel-2); padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }

  .world { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }

  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 20px; min-width: 0; }

  .village { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
  .village .big { font: 16px/1.4 var(--pixel); color: var(--green); }
  .muted { color: var(--muted); }

  .player { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 12px 0; border-top: 1px solid var(--line); }
  .player:first-of-type { border-top: 0; padding-top: 0; }
  .head { width: 48px; height: 48px; image-rendering: pixelated; border-radius: 4px; background: var(--panel-2); }
  .pname { font: 13px var(--pixel); }
  .bars { display: flex; flex-direction: column; gap: 4px; font-size: 15px; letter-spacing: 1px; }
  .where { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); }
  .where b { color: var(--text); }

  .kit { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .kit li { display: flex; gap: 10px; align-items: baseline; }
  .kit .n { font-weight: 700; color: var(--gold); min-width: 2.2em; text-align: right; }

  .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  .feed li { display: flex; gap: 8px; }
  .feed .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .feed .chat { color: var(--text); }
  .feed .join { color: var(--green); margin: 0; font-size: 14px; }
  .feed .leave { color: var(--muted); }
  .feed .adv { color: var(--gold); }
  .feed .death { color: var(--red); }
  .feed .server { color: var(--blue); }

  form.search { display: flex; gap: 8px; margin-bottom: 10px; }
  form.search input { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 8px; border: 2px solid var(--line); background: var(--panel-2); color: var(--text); }
  button { font: inherit; font-weight: 700; padding: 8px 14px; border-radius: 8px; border: 2px solid var(--line); background: var(--panel-2); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--green); }
  form.search button { background: var(--green); color: #102010; border-color: var(--green); }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .quick button { font-size: 13px; padding: 4px 10px; font-weight: 600; }
  .results { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .results button { width: 100%; text-align: left; font-weight: 400; }
  .results b { display: block; }
  .results span { color: var(--muted); font-size: 13px; }
  .article h3 { font: 15px/1.4 var(--pixel); color: var(--green); margin: 4px 0 10px; }
  .article p { margin: 0 0 12px; }
  details { border-top: 1px solid var(--line); padding: 8px 0; }
  summary { cursor: pointer; font-weight: 700; }
  details p { margin: 8px 0 0; white-space: pre-wrap; }
  .back { margin-bottom: 10px; font-size: 13px; padding: 4px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="/icon.png" alt="" onerror="this.style.display='none'">
    <h1>Village Server</h1>
    <span id="status" class="pill off">Starting...</span>
    <div class="join">Join in Minecraft: <code id="addr" title="Click to copy">localhost:23377</code></div>
  </header>

  <div class="world" id="world"></div>

  <div class="layout">
    <main>
      <section class="card">
        <h2>The Village</h2>
        <div id="village" class="muted">Looking for a village...</div>
      </section>

      <section class="card">
        <h2>Who's playing</h2>
        <div id="players" class="muted">Nobody yet.</div>
      </section>

      <section class="card">
        <h2>Look it up on the Minecraft Wiki</h2>
        <form class="search" id="search">
          <input id="q" placeholder="Villager, Iron Golem, Diamond..." autocomplete="off">
          <button>Search</button>
        </form>
        <div class="quick" id="quick"></div>
        <div id="wiki"></div>
      </section>
    </main>

    <aside>
      <section class="card">
        <h2>Starter kit</h2>
        <p class="muted" style="margin-top:0">Everyone gets this the first time they join.</p>
        <ul class="kit" id="kit"></ul>
      </section>

      <section class="card">
        <h2>What's happening</h2>
        <ul class="feed" id="feed"><li class="muted">Nothing yet.</li></ul>
      </section>
    </aside>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

$('addr').onclick = () => {
  navigator.clipboard?.writeText($('addr').textContent);
  $('addr').textContent = 'Copied!';
  setTimeout(() => { $('addr').textContent = 'localhost:23377'; }, 1200);
};

function timeOfDay(t) {
  if (t < 1000) return 'Sunrise';
  if (t < 6000) return 'Morning';
  if (t < 12000) return 'Afternoon';
  if (t < 13000) return 'Sunset';
  if (t < 23000) return 'Night';
  return 'Sunrise';
}

const VILLAGE_NAMES = { plains: 'Plains village', desert: 'Desert village', savanna: 'Savanna village', taiga: 'Taiga village', snowy: 'Snowy village' };

function bar(value, max, full, half, empty) {
  const n = Math.max(0, Math.min(max, value));
  let s = '';
  for (let i = 0; i < max / 2; i++) s += n >= i * 2 + 2 ? full : n >= i * 2 + 1 ? half : empty;
  return s;
}

function render(s) {
  const status = $('status');
  status.textContent = s.online ? 'Online' : 'Starting up...';
  status.className = 'pill ' + (s.online ? 'on' : 'off');

  const stats = [
    ['Version', s.version || '?'],
    ['Day', s.online ? s.day : '-'],
    ['Time', s.online ? timeOfDay(s.daytime) : '-'],
    ['Difficulty', s.online ? s.difficulty : '-'],
    // Villagers only count while someone is near enough to load the village.
    ['Villagers', !s.online ? '-' : s.villagers || (s.players.length ? 0 : 'Asleep')],
    ['Players', s.online ? `${s.players.length} / ${s.max ?? '?'}` : '-'],
  ];
  $('world').innerHTML = stats.map(([k, v]) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');

  const v = s.village;
  $('village').className = v ? 'village' : 'muted';
  $('village').innerHTML = v
    ? `<span class="big">${esc(VILLAGE_NAMES[v.kind] || 'Village')}</span>
       <span>Spawn is at <b>${v.x}, ${v.y}, ${v.z}</b></span>
       <span class="muted">Everyone who joins starts here, and comes back here when they die (unless they sleep in a bed somewhere else).</span>`
    : esc(s.online ? s.villageNote : 'The server is starting. The village gets picked as soon as it is ready.');

  if (!s.players || !s.players.length) {
    $('players').className = 'muted';
    $('players').textContent = s.online ? 'Nobody yet. Join at localhost:23377!' : 'Nobody yet.';
  } else {
    $('players').className = '';
    $('players').innerHTML = s.players.map(p => {
      const far = v && p.dim === 'overworld' ? Math.round(Math.hypot(p.pos[0] - v.x, p.pos[2] - v.z)) : null;
      const where = p.dim === 'overworld' ? 'Overworld' : p.dim === 'the_nether' ? 'The Nether' : p.dim === 'the_end' ? 'The End' : p.dim;
      return `<div class="player">
        <img class="head" alt="" src="https://mc-heads.net/avatar/${esc(p.name)}/48" onerror="this.style.visibility='hidden'">
        <div>
          <div class="pname">${esc(p.name)}</div>
          <div class="muted" style="font-size:13px;margin-top:4px">Level ${esc(p.xp)}</div>
        </div>
        <div class="bars">
          <span title="Health ${esc(Math.ceil(p.health))}/20" style="color:var(--red)">${bar(Math.ceil(p.health), 20, '♥', '♡', '·')}</span>
          <span title="Food ${esc(p.food)}/20" style="color:var(--brown)">${bar(p.food, 20, '●', '◐', '·')}</span>
        </div>
        <div class="where">
          <b>${esc(where)}</b><br>
          ${esc(p.pos.join(', '))}<br>
          ${far === null ? '' : far < 60 ? 'In the village' : `${far} blocks from the village`}
        </div>
      </div>`;
    }).join('');
  }

  if (s.kit && !$('kit').children.length) {
    $('kit').innerHTML = s.kit.map(i => `<li><span class="n">${esc(i.count)}</span><span>${esc(i.label)}</span></li>`).join('');
  }

  $('feed').innerHTML = s.events && s.events.length
    ? s.events.map(e => `<li><span class="t">${esc(e.time.slice(0, 5))}</span><span class="${esc(e.kind)}">${esc(e.text)}</span></li>`).join('')
    : '<li class="muted">Nothing yet.</li>';
}

async function tick() {
  try {
    const r = await fetch('/api/state');
    render(await r.json());
  } catch {
    $('status').textContent = 'Offline';
    $('status').className = 'pill off';
  }
  setTimeout(tick, 2000);
}
tick();

// ---------- wiki ----------

const QUICK = ['Village', 'Villager', 'Trading', 'Iron Golem', 'Bell', 'Bed', 'Crafting', 'Diamond'];
$('quick').innerHTML = QUICK.map(t => `<button type="button" data-page="${esc(t)}">${esc(t)}</button>`).join('');
$('quick').onclick = e => { const t = e.target.dataset.page; if (t) openPage(t); };

let lastResults = '';

$('search').onsubmit = async e => {
  e.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  $('wiki').innerHTML = '<p class="muted">Searching...</p>';
  try {
    const r = await (await fetch('/api/wiki/search?q=' + encodeURIComponent(q))).json();
    if (r.error) throw new Error(r.error);
    lastResults = r.results.length
      ? '<ul class="results">' + r.results.map(x => `<li><button type="button" data-page="${esc(x.title)}"><b>${esc(x.title)}</b><span>${esc(x.snippet)}</span></button></li>`).join('') + '</ul>'
      : '<p class="muted">Nothing found. Try a simpler word, like the name of a mob or block.</p>';
    $('wiki').innerHTML = lastResults;
  } catch {
    $('wiki').innerHTML = '<p class="muted">The wiki didn\'t answer. Try again in a moment.</p>';
  }
};

$('wiki').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.page) openPage(b.dataset.page);
  if (b.dataset.back) $('wiki').innerHTML = lastResults;
};

async function openPage(title) {
  $('wiki').innerHTML = '<p class="muted">Opening ' + esc(title) + '...</p>';
  try {
    const r = await (await fetch('/api/wiki/page?title=' + encodeURIComponent(title))).json();
    if (r.error) throw new Error(r.error);
    $('wiki').innerHTML = `<div class="article">
      ${lastResults ? '<button type="button" class="back" data-back="1">&larr; Back to results</button>' : ''}
      <h3>${esc(r.title)}</h3>
      <p>${esc(r.summary)}</p>
      ${r.sections.map(s => `<details data-index="${esc(s.index)}"><summary>${esc(s.title)}</summary><p class="muted">Loading...</p></details>`).join('')}
    </div>`;
    for (const d of $('wiki').querySelectorAll('details')) {
      d.addEventListener('toggle', async () => {
        if (!d.open || d.dataset.loaded) return;
        d.dataset.loaded = '1';
        const p = d.querySelector('p');
        try {
          const s = await (await fetch(`/api/wiki/section?title=${encodeURIComponent(r.title)}&index=${d.dataset.index}`)).json();
          if (s.error) throw new Error(s.error);
          p.className = '';
          p.textContent = s.content || 'This part is empty.';
        } catch {
          d.dataset.loaded = '';
          p.textContent = 'Couldn\'t load this part. Close it and open it again to retry.';
        }
      });
    }
  } catch {
    $('wiki').innerHTML = '<p class="muted">Couldn\'t open that page. Try searching for it instead.</p>';
  }
}
</script>
</body>
</html>
